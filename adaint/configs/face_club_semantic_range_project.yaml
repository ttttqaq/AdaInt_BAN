# Scratch/full-parameter range projection; original affine/LUT/DC retained.
# Train+validation native export is performed once by infer_after_generation.
exp_name: club_clean_1
custom_imports:
  imports:
  - adaint
  allow_failed_imports: false
gen: 1
train_epochs: 100
adaint_fix_epochs: 0
checkpoint_interval_epochs: 1
evaluation_interval_epochs: 1
infer_after_generation: true
enable_kd: false
kdloss_type: MSELoss
kdloss_weight: 0.1
model:
  type: AiLUTDual
  lut_mode: basis
  postprocess:
    result_condition: true
    global_dc: true
    regional_dc: true
    global_dc_limit: 0.08
    regional_dc_limit: 0.04
    calibration_hidden: 64
    multiscale: true
    guidance: luminance
    freeze_global: false
    fixed_rgb_bias: null
  n_ranks: 5
  n_vertices: 33
  curve_points: 16
  stats_bins: 16
  stats_pool_size: 64
  condition_dim: 256
  head_hidden_dim: 128
  local_resolution: 128
  local_channels: 16
  context_size: 256
  min_interval: 0.001
  guided_filter_radius: 2
  guided_filter_epsilon: 0.001
  backbone: tpami
  pretrained: false
  smooth_factor: 1.0e-05
  monotonicity_factor: 0.01
  global_magnitude_factor: 1.0e-05
  local_magnitude_factor: 0.001
  local_smoothness_factor: 0.0001
  edge_smoothness_scale: 10.0
  color_loss_weight: 0.3
  color_grid_size: 16
  color_top_fraction: 0.1
  color_hard_weight: 0.25
  kd_decay_start_ratio: 0.3
  kd_decay_end_ratio: 0.8
  kd_final_weight: 0.0
  local_enabled: true
  use_region_condition: true
  region_samples_size: 32
  region_sample_mix: 0.5
  region_min_area: 0.0001
  foreground_rgb_weight: 0.1
  background_rgb_weight: 0.1
  foreground_color_weight: 0.1
  background_color_weight: 0.1
  face_color_weight: 0.0
  boundary_gradient_weight: 0.0
  range_project:
    enabled: true
    range_weight: 0.1
    hard_weight: 0.1
    gradient_weight: 0.01
    hard_fraction: 0.1
test_cfg:
  metrics:
  - PSNR
  - deltaE_P3
  - deltaE_P3_top
  - deltaE_P3_foreground
  - deltaE_P3_background
  - deltaL_P3_foreground
  - deltaAB_P3_foreground
  crop_border: 0
data:
  workers_per_gpu: 2
  train_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 2
    persistent_workers: true
  val_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 2
    persistent_workers: true
  test_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 2
    persistent_workers: true
  train:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/club_clean/train
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/club_clean/train
    ann_file: adaint/annfiles/Face/club_clean_train.txt
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: ResizeToMatch
      keys:
      - lq
      reference_key: gt
      interpolation: area
    - type: RandomRatioCrop
      keys:
      - lq
      - gt
      crop_ratio:
      - 0.6
      - 1.0
    - type: Flip
      keys:
      - lq
      - gt
      flip_ratio: 0.5
      direction: horizontal
    - type: RandomColorJitter
      keys:
      - lq
      brightness: 0.2
      saturation: 0.2
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
    test_mode: false
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  val:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/club_clean/train
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/club_clean/train
    ann_file: adaint/annfiles/Face/club_clean_val.txt
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: ResizeToMatch
      keys:
      - lq
      reference_key: gt
      interpolation: area
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  test:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/club_clean/test
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/club_clean/test
    ann_file: adaint/annfiles/Face/club_clean_test.txt
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
    - type: Collect
      keys:
      - lq
      meta_keys:
      - lq_path
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
optimizers:
  type: Adam
  lr: 0.0001
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  paramwise_cfg:
    custom_keys:
      adaint:
        lr_mult: 0.1
lr_config:
  policy: CosineAnnealing
  min_lr: 1.0e-06
  by_epoch: false
checkpoint_config:
  save_optimizer: true
evaluation:
  save_image: false
log_config:
  hooks:
  - type: LUTEpochTextLoggerHook
visual_config: null
dist_params:
  backend: nccl
log_level: INFO
postprocess_init: null
work_dir: ./work_dirs/club_clean_1
load_from: null
resume_from: null
find_unused_parameters: true
log_interval_epochs: 1
dataset: face
semantic_masks:
  region_label: person
  train_foreground_root: /DB/data/yujietang/IQ-LUT/face_dataset/club_clean/person_masks/train
  val_foreground_root: /DB/data/yujietang/IQ-LUT/face_dataset/club_clean/person_masks/train
  test_foreground_root: /DB/data/yujietang/IQ-LUT/face_dataset/club_clean/person_masks/test
  train_face_root: null
  val_face_root: null
  test_face_root: null
  foreground_suffix: _mask
  face_suffix: _mask
  feather_radius: 1
  perturb_probability: 0.0
  perturb_pixels: 1
best_checkpoint_metric: PSNR
best_checkpoint_rule: greater
dataset_split:
  description: Fixed random 10% holdout sampled once with Python random.Random(2026)
    from numerically sorted retained pair IDs; stored annfiles define all future runs.
    Independent test has no GT.
  original_source_train_count: 158
  removed_pair_count: 9
  removed_pair_ids:
  - 119
  - 120
  - 127
  - 134
  - 136
  - 174
  - 175
  - 176
  - 186
  source_train_count: 149
  train_count: 134
  val_count: 15
  test_count: 30
  val_ratio: 0.1
  split_seed: 2026
  split_method: random.sample once; ceil(N*0.1); fixed text lists
  fixed_val_ids:
  - 1
  - 35
  - 42
  - 46
  - 76
  - 81
  - 101
  - 140
  - 145
  - 158
  - 164
  - 167
  - 179
  - 181
  - 185
  test_uses_validation: false

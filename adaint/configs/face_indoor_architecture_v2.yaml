exp_name: indoor_archv2_only_spatial_smoothness
custom_imports:
  imports:
    - adaint
  allow_failed_imports: false

# The architecture always uses color statistics, separate nonlinear heads,
# a 1D-tone -> spatial residual-3D-LUT cascade, vertex-conditioned signed LUT
# routing, and two spatial LUT branches. The switches below control only the
# independent constraints around that architecture.
#
# For a single-factor ablation, copy this file, change one switch, and give
# the copy a unique exp_name and work_dir. Also point teacher_config_path to
# that copy so later generations build the same teacher model.
# If enable_kd is false, gen: 1 is enough for a no-distillation baseline.
gen: 4
enable_kd: true
teacher_config_path: adaint/configs/face_indoor_architecture_v2.yaml
kdloss_type: L1Loss
kdloss_weight: 1

model:
  type: AiLUTArchitectureV2
  n_ranks: 4
  n_vertices: 33
  coarse_vertices: 17
  curve_points: 16

  # Shared condition encoder and task-specific head sizes.
  stats_bins: 16
  stats_pool_size: 64
  condition_dim: 256
  head_hidden_dim: 128
  vertex_embedding_dim: 64

  # Spatial residual LUT cascade. This is part of the architecture, not an
  # ablation switch. Raise n_spatial_luts only after validating the 2-LUT form.
  n_spatial_luts: 2
  guide_resolution: 128
  guide_channels: 16
  guide_temperature: 1.0

  # Bounded signed low-rank LUT routing.
  signed_weight_scale: 1.0
  expert_init_scale: 0.01

  # Independent constraint switches.
  use_interval_floor: false
  min_interval: 0.001
  use_flexible_tone_endpoints: false
  tone_endpoint_range: 0.05
  # true: constrain only dR/dR, dG/dG, dB/dB;
  # false: reproduce the legacy all-nine-partial-derivatives constraint.
  use_diagonal_monotonicity: false
  use_spatial_smoothness: true
  spatial_smoothness_factor: 0.001

  en_adaint: true
  en_adaint_share: false
  backbone: tpami
  pretrained: false
  n_colors: 3
  sparse_factor: 0.0
  smooth_factor: 0.0
  monotonicity_factor: 2.0
  recons_loss:
    type: L1Loss
    loss_weight: 1.0

train_cfg:
  n_fix_iters: 335
test_cfg:
  metrics:
    - PSNR
    - deltaE
  crop_border: 0

train_pipeline: &train_pipeline
  - type: LoadImageFromFile
    io_backend: disk
    key: lq
    backend: pillow
    channel_order: rgb
  - type: LoadImageFromFile
    io_backend: disk
    key: gt
    backend: pillow
    channel_order: rgb
  - type: ResizeToMatch
    keys: [lq]
    reference_key: gt
    interpolation: area
  - type: RandomRatioCrop
    keys: [lq, gt]
    crop_ratio: [0.6, 1.0]
  - type: Flip
    keys: [lq, gt]
    flip_ratio: 0.5
    direction: horizontal
  - type: RandomColorJitter
    keys: [lq]
    brightness: 0.2
    saturation: 0.2
  - type: FlexibleRescaleToZeroOne
    keys: [lq, gt]
    precision: 32
  - type: ImageToTensor
    keys: [lq, gt]
  - type: Collect
    keys: [lq, gt]
    meta_keys: [lq_path, gt_path]

paired_test_pipeline: &paired_test_pipeline
  - type: LoadImageFromFile
    io_backend: disk
    key: lq
    backend: pillow
    channel_order: rgb
  - type: LoadImageFromFile
    io_backend: disk
    key: gt
    backend: pillow
    channel_order: rgb
  - type: ResizeToMatch
    keys: [lq]
    reference_key: gt
    interpolation: area
  - type: FlexibleRescaleToZeroOne
    keys: [lq, gt]
    precision: 32
  - type: ImageToTensor
    keys: [lq, gt]
  - type: Collect
    keys: [lq, gt]
    meta_keys: [lq_path, gt_path]

blind_test_pipeline: &blind_test_pipeline
  - type: LoadImageFromFile
    io_backend: disk
    key: lq
    backend: pillow
    channel_order: rgb
  - type: FlexibleRescaleToZeroOne
    keys: [lq]
    precision: 32
  - type: ImageToTensor
    keys: [lq]
  - type: Collect
    keys: [lq]
    meta_keys: [lq_path]

data:
  workers_per_gpu: 4
  train_dataloader:
    samples_per_gpu: 1
  val_dataloader:
    samples_per_gpu: 1
  test_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 1
  train:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    ann_file: adaint/annfiles/Face/indoor_train.txt
    pipeline: *train_pipeline
    test_mode: false
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  val:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    ann_file: adaint/annfiles/Face/indoor_val.txt
    pipeline: *paired_test_pipeline
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  test:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    ann_file: adaint/annfiles/Face/test.txt
    pipeline: *blind_test_pipeline
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'

optimizers:
  type: Adam
  lr: 0.0001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  paramwise_cfg:
    custom_keys:
      adaint:
        lr_mult: 0.1
lr_config:
  policy: CosineAnnealing
  min_lr: 0.000001
  by_epoch: false

total_iters: 6700
checkpoint_config:
  interval: 67
  save_optimizer: false
  by_epoch: false
evaluation:
  interval: 67
  save_image: false
log_config:
  interval: 20
  hooks:
    - type: TextLoggerHook
      by_epoch: false
visual_config: null

dist_params:
  backend: nccl
log_level: INFO
work_dir: ./work_dirs/indoor_archv2_only_spatial_smoothness
load_from: null
resume_from: null
workflow:
  - [train, 1]
find_unused_parameters: true


# python tools/train_kd_unified.py adaint/configs/face_indoor_architecture_v2.yaml --gpus 1

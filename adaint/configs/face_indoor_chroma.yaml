exp_name: face_indoor_chroma_hard
custom_imports:
  imports:
  - adaint
  allow_failed_imports: false
gen: 1
train_epochs: 100
adaint_fix_epochs: 5
checkpoint_interval_epochs: 1
evaluation_interval_epochs: 1
infer_after_generation: true
enable_kd: false
kdloss_type: MSELoss
kdloss_weight: 0.1
model:
  type: AiLUT
  n_ranks: 5
  n_vertices: 33
  curve_points: 16
  stats_bins: 16
  stats_pool_size: 64
  condition_dim: 256
  head_hidden_dim: 128
  local_resolution: 128
  local_channels: 16
  context_size: 256
  min_interval: 0.001
  guided_filter_radius: 2
  guided_filter_epsilon: 0.001
  backbone: tpami
  pretrained: false
  smooth_factor: 1.0e-05
  monotonicity_factor: 0.01
  global_magnitude_factor: 1.0e-05
  local_magnitude_factor: 0.001
  local_smoothness_factor: 0.0001
  edge_smoothness_scale: 10.0
  # RGB MSE + 0.3 * (0.75 * mean Lab distance + 0.25 * top-grid ab distance) / 100.
  color_loss_weight: 0.3
  color_grid_size: 16
  color_top_fraction: 0.1
  color_hard_weight: 0.25
  color_hard_mode: ab
  local_gain_mode: shared
  kd_decay_start_ratio: 0.3
  kd_decay_end_ratio: 0.8
  kd_final_weight: 0.0
checkpoint_selection:
  metric: chroma_P3_top
  psnr_tolerance: 0.1
test_cfg:
  metrics:
  - PSNR
  - deltaE_P3
  - deltaE_P3_top
  - chroma_P3
  - chroma_P3_top
  - chroma_P3_p90
  - L_error_P3
  crop_border: 0
train_pipeline:
- type: LoadImageFromFile
  io_backend: disk
  key: lq
  backend: pillow
  channel_order: rgb
- type: LoadImageFromFile
  io_backend: disk
  key: gt
  backend: pillow
  channel_order: rgb
- type: ResizeToMatch
  keys:
  - lq
  reference_key: gt
  interpolation: area
- type: RandomRatioCrop
  keys:
  - lq
  - gt
  crop_ratio:
  - 0.6
  - 1.0
- type: Flip
  keys:
  - lq
  - gt
  flip_ratio: 0.5
  direction: horizontal
- type: RandomColorJitter
  keys:
  - lq
  brightness: 0.2
  saturation: 0.2
- type: FlexibleRescaleToZeroOne
  keys:
  - lq
  - gt
  precision: 32
- type: ImageToTensor
  keys:
  - lq
  - gt
- type: Collect
  keys:
  - lq
  - gt
  meta_keys:
  - lq_path
  - gt_path
paired_test_pipeline:
- type: LoadImageFromFile
  io_backend: disk
  key: lq
  backend: pillow
  channel_order: rgb
- type: LoadImageFromFile
  io_backend: disk
  key: gt
  backend: pillow
  channel_order: rgb
- type: ResizeToMatch
  keys:
  - lq
  reference_key: gt
  interpolation: area
- type: FlexibleRescaleToZeroOne
  keys:
  - lq
  - gt
  precision: 32
- type: ImageToTensor
  keys:
  - lq
  - gt
- type: Collect
  keys:
  - lq
  - gt
  meta_keys:
  - lq_path
  - gt_path
blind_test_pipeline:
- type: LoadImageFromFile
  io_backend: disk
  key: lq
  backend: pillow
  channel_order: rgb
- type: FlexibleRescaleToZeroOne
  keys:
  - lq
  precision: 32
- type: ImageToTensor
  keys:
  - lq
- type: Collect
  keys:
  - lq
  meta_keys:
  - lq_path
data:
  workers_per_gpu: 4
  train_dataloader:
    samples_per_gpu: 1
  val_dataloader:
    samples_per_gpu: 1
  test_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 1
  train:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    ann_file: adaint/annfiles/Face/indoor_train.txt
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: ResizeToMatch
      keys:
      - lq
      reference_key: gt
      interpolation: area
    - type: RandomRatioCrop
      keys:
      - lq
      - gt
      crop_ratio:
      - 0.6
      - 1.0
    - type: Flip
      keys:
      - lq
      - gt
      flip_ratio: 0.5
      direction: horizontal
    - type: RandomColorJitter
      keys:
      - lq
      brightness: 0.2
      saturation: 0.2
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
    test_mode: false
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  val:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    ann_file: adaint/annfiles/Face/indoor_val.txt
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: ResizeToMatch
      keys:
      - lq
      reference_key: gt
      interpolation: area
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  test:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    ann_file: adaint/annfiles/Face/test.txt
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
    - type: Collect
      keys:
      - lq
      meta_keys:
      - lq_path
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
optimizers:
  type: Adam
  lr: 0.0001
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  paramwise_cfg:
    custom_keys:
      adaint:
        lr_mult: 0.1
lr_config:
  policy: CosineAnnealing
  min_lr: 1.0e-06
  by_epoch: false
checkpoint_config:
  save_optimizer: true
evaluation:
  save_image: false
log_config:
  hooks:
  - type: LUTEpochTextLoggerHook
visual_config: null
dist_params:
  backend: nccl
log_level: INFO
work_dir: ./work_dirs/face_indoor_chroma_hard
load_from: null
resume_from: null
find_unused_parameters: true
log_interval_epochs: 1
dataset: face

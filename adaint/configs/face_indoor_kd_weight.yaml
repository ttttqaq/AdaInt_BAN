# Main-branch AiLUT-BAN baseline with one experimental change:
# for gen > 0, use 0.25 * L1(student, previous generation's teacher).
# gen 0 has no distillation loss. Edit kdloss_weight to run another ablation.
exp_name: indoor_kd05

custom_imports:
  imports: [adaint]
  allow_failed_imports: false

gen: 3
teacher_config_path: adaint/configs/face_indoor.py
kdloss_type: L1Loss
kdloss_weight: 0.5

model:
  type: AiLUT_kd_unified
  n_ranks: 3
  n_vertices: 33
  en_adaint: true
  en_adaint_share: false
  backbone: tpami
  pretrained: false
  n_colors: 3
  sparse_factor: 0.0001
  smooth_factor: 0
  monotonicity_factor: 10.0
  recons_loss:
    type: L1Loss
    loss_weight: 1.0

train_cfg:
  n_fix_iters: 335
test_cfg:
  metrics: [PSNR, deltaE]
  crop_border: 0

train_pipeline: &train_pipeline
  - type: LoadImageFromFile
    io_backend: disk
    key: lq
    backend: pillow
    channel_order: rgb
  - type: LoadImageFromFile
    io_backend: disk
    key: gt
    backend: pillow
    channel_order: rgb
  - type: ResizeToMatch
    keys: [lq]
    reference_key: gt
    interpolation: area
  - type: RandomRatioCrop
    keys: [lq, gt]
    crop_ratio: [0.6, 1.0]
  - type: Flip
    keys: [lq, gt]
    flip_ratio: 0.5
    direction: horizontal
  - type: RandomColorJitter
    keys: [lq]
    brightness: 0.2
    saturation: 0.2
  - type: FlexibleRescaleToZeroOne
    keys: [lq, gt]
    precision: 32
  - type: ImageToTensor
    keys: [lq, gt]
  - type: Collect
    keys: [lq, gt]
    meta_keys: [lq_path, gt_path]

test_pipeline: &test_pipeline
  - type: LoadImageFromFile
    io_backend: disk
    key: lq
    backend: pillow
    channel_order: rgb
  - type: LoadImageFromFile
    io_backend: disk
    key: gt
    backend: pillow
    channel_order: rgb
  - type: ResizeToMatch
    keys: [lq]
    reference_key: gt
    interpolation: area
  - type: FlexibleRescaleToZeroOne
    keys: [lq, gt]
    precision: 32
  - type: ImageToTensor
    keys: [lq, gt]
  - type: Collect
    keys: [lq, gt]
    meta_keys: [lq_path, gt_path]

data:
  workers_per_gpu: 4
  train_dataloader:
    samples_per_gpu: 1
  val_dataloader:
    samples_per_gpu: 1
  test_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 1
  train:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    ann_file: adaint/annfiles/Face/indoor_train.txt
    pipeline: *train_pipeline
    test_mode: false
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  val:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    ann_file: adaint/annfiles/Face/indoor_val.txt
    pipeline: *test_pipeline
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  test:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    ann_file: adaint/annfiles/Face/indoor_val.txt
    pipeline: *test_pipeline
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'

optimizers:
  type: Adam
  lr: 0.0001
  weight_decay: 0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  paramwise_cfg:
    custom_keys:
      adaint:
        lr_mult: 0.1
lr_config: null

total_iters: 3350
checkpoint_config:
  interval: 67
  save_optimizer: false
  by_epoch: false
evaluation:
  interval: 67
  save_image: false
log_config:
  interval: 20
  hooks:
    - type: TextLoggerHook
      by_epoch: false
visual_config: null

dist_params:
  backend: nccl
log_level: INFO
work_dir: ./work_dirs/indoor_kd05
load_from: null
resume_from: null
workflow:
  - [train, 1]
find_unused_parameters: true

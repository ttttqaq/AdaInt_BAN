exp_name: indoor_tone_ablation_all_on
custom_imports:
  imports:
    - adaint
  allow_failed_imports: false

# Independent switches for the four method changes. gen 0 never distills.
# For a single-factor ablation, copy this file, change one switch or weight,
# and give the copy a unique exp_name and work_dir. Also point
# teacher_config_path to that copy so later generations use the same model.
# If enable_kd is false, gen: 1 is enough for a no-distillation baseline.
gen: 4
enable_kd: true
teacher_config_path: adaint/configs/face_indoor_tone_ablation.yaml
kdloss_type: L1Loss
kdloss_weight: 0.25

model:
  type: AiLUT_kd_unified
  n_ranks: 4
  n_vertices: 33
  coarse_vertices: 17
  use_tone_curve: true
  curve_points: 16
  use_softmax_experts: true
  expert_temperature: 1.0
  # Use T(v_i) at AdaInt's learned vertices instead of legacy T(i / (N - 1)).
  tone_at_adaptive_vertices: true
  # Penalize nonmonotonicity of the final mixed LUT, not each residual expert.
  monotonicity_on_fused_lut: true
  # Smooth, centered expert perturbations replace tiny voxelwise noise.
  diverse_expert_init: true
  expert_init_scale: 0.01
  en_adaint: true
  en_adaint_share: false
  backbone: tpami   # 'res18''tpami'
  pretrained: false
  n_colors: 3
  # Softmax weights sum to one, so the legacy L2 weight penalty would push
  # expert mixtures toward uniformity and prevent specialization.
  sparse_factor: 0.0
  smooth_factor: 0.0
  monotonicity_factor: 10.0
  recons_loss:
    type: L1Loss
    loss_weight: 1.0

train_cfg:
  n_fix_iters: 335
test_cfg:
  metrics:
    - PSNR
    - deltaE
  crop_border: 0

train_pipeline: &train_pipeline
  - type: LoadImageFromFile
    io_backend: disk
    key: lq
    backend: pillow
    channel_order: rgb
  - type: LoadImageFromFile
    io_backend: disk
    key: gt
    backend: pillow
    channel_order: rgb
  - type: ResizeToMatch
    keys: [lq]
    reference_key: gt
    interpolation: area
  - type: RandomRatioCrop
    keys: [lq, gt]
    crop_ratio: [0.6, 1.0]
  - type: Flip
    keys: [lq, gt]
    flip_ratio: 0.5
    direction: horizontal
  - type: RandomColorJitter
    keys: [lq]
    brightness: 0.2
    saturation: 0.2
  - type: FlexibleRescaleToZeroOne
    keys: [lq, gt]
    precision: 32
  - type: ImageToTensor
    keys: [lq, gt]
  - type: Collect
    keys: [lq, gt]
    meta_keys: [lq_path, gt_path]

paired_test_pipeline: &paired_test_pipeline
  - type: LoadImageFromFile
    io_backend: disk
    key: lq
    backend: pillow
    channel_order: rgb
  - type: LoadImageFromFile
    io_backend: disk
    key: gt
    backend: pillow
    channel_order: rgb
  - type: ResizeToMatch
    keys: [lq]
    reference_key: gt
    interpolation: area
  - type: FlexibleRescaleToZeroOne
    keys: [lq, gt]
    precision: 32
  - type: ImageToTensor
    keys: [lq, gt]
  - type: Collect
    keys: [lq, gt]
    meta_keys: [lq_path, gt_path]

blind_test_pipeline: &blind_test_pipeline
  - type: LoadImageFromFile
    io_backend: disk
    key: lq
    backend: pillow
    channel_order: rgb
  - type: FlexibleRescaleToZeroOne
    keys: [lq]
    precision: 32
  - type: ImageToTensor
    keys: [lq]
  - type: Collect
    keys: [lq]
    meta_keys: [lq_path]

data:
  workers_per_gpu: 4
  train_dataloader:
    samples_per_gpu: 1
  val_dataloader:
    samples_per_gpu: 1
  test_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 1
  train:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    ann_file: adaint/annfiles/Face/indoor_train.txt
    pipeline: *train_pipeline
    test_mode: false
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  val:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/1_indoors_data
    ann_file: adaint/annfiles/Face/indoor_val.txt
    pipeline: *paired_test_pipeline
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  test:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    ann_file: adaint/annfiles/Face/test.txt
    pipeline: *blind_test_pipeline
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'

optimizers:
  type: Adam
  lr: 0.0001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  paramwise_cfg:
    custom_keys:
      adaint:
        lr_mult: 0.1
lr_config:
  policy: CosineAnnealing
  min_lr: 0.000001
  by_epoch: false

total_iters: 3350
checkpoint_config:
  interval: 67
  save_optimizer: false
  by_epoch: false
evaluation:
  interval: 67
  save_image: false
log_config:
  interval: 20
  hooks:
    - type: TextLoggerHook
      by_epoch: false
visual_config: null

dist_params:
  backend: nccl
log_level: INFO
work_dir: ./work_dirs/indoor_tone_ablation_all_on
load_from: null
resume_from: null
workflow:
  - [train, 1]
find_unused_parameters: true


# python tools/train_kd_unified.py adaint/configs/face_indoor_tone_ablation.yaml --gpus 1

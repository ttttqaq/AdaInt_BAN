# Backlit dataset; independent of indoor/outdoor configs.
# Train: first 90% of numeric IDs; val: last ceil(10%).
# No independent test split: data.test reuses validation, not a held-out test set.
# Native foreground ROI + centered Lab residuals. ALL retained model parameters train jointly.
# Mask 82 has an input-verified, conservative exclusion; recompute baseline with the same masks.
exp_name: face_niguang_roi_lab
custom_imports:
  imports:
  - adaint
  allow_failed_imports: false
gen: 1
seed: 2026
roi_init_from: ./work_dirs/face_niguang_semantic_basis/gen_0/best.pth
train_epochs: 30
adaint_fix_epochs: 0
checkpoint_interval_epochs: 1
evaluation_interval_epochs: 1
infer_after_generation: true
enable_kd: false
kdloss_type: MSELoss
kdloss_weight: 0.1
model:
  type: AiLUTROILab
  lut_mode: basis
  roi_size: 128
  roi_margin: 0.15
  roi_channels: 16
  roi_lightness_limit: 8.0
  roi_chroma_limit: 4.0
  roi_mean_lightness_weight: 0.1
  roi_spatial_lightness_weight: 0.1
  roi_magnitude_factor: 0.001
  roi_smoothness_factor: 0.0001
  n_ranks: 5
  n_vertices: 33
  curve_points: 16
  stats_bins: 16
  stats_pool_size: 64
  condition_dim: 256
  head_hidden_dim: 128
  local_resolution: 128
  local_channels: 16
  context_size: 256
  min_interval: 0.001
  guided_filter_radius: 2
  guided_filter_epsilon: 0.001
  backbone: tpami
  pretrained: false
  smooth_factor: 1.0e-05
  monotonicity_factor: 0.01
  global_magnitude_factor: 1.0e-05
  local_magnitude_factor: 0.001
  local_smoothness_factor: 0.0001
  edge_smoothness_scale: 10.0
  color_loss_weight: 0.3
  color_grid_size: 16
  color_top_fraction: 0.1
  color_hard_weight: 0.25
  kd_decay_start_ratio: 0.3
  kd_decay_end_ratio: 0.8
  kd_final_weight: 0.0
  local_enabled: true
  use_region_condition: true
  region_samples_size: 32
  region_sample_mix: 0.5
  region_min_area: 0.0001
  foreground_rgb_weight: 0.1
  background_rgb_weight: 0.1
  foreground_color_weight: 0.1
  background_color_weight: 0.1
  face_color_weight: 0.0
  boundary_gradient_weight: 0.0
test_cfg:
  metrics:
  - PSNR
  - deltaE_P3
  - deltaE_P3_top
  - deltaE_P3_foreground
  - deltaE_P3_background
  - deltaL_P3_foreground
  - deltaAB_P3_foreground
  - deltaL_P3_background
  - deltaL_P3_highlights
  crop_border: 0
data:
  workers_per_gpu: 4
  train_dataloader:
    samples_per_gpu: 1
  val_dataloader:
    samples_per_gpu: 1
  test_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 1
  train:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/niguang_train_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/niguang_train_data
    ann_file: adaint/annfiles/Face/niguang_train.txt
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: ResizeToMatch
      keys:
      - lq
      reference_key: gt
      interpolation: area
    - type: RandomRatioCrop
      keys:
      - lq
      - gt
      crop_ratio:
      - 0.6
      - 1.0
    - type: Flip
      keys:
      - lq
      - gt
      flip_ratio: 0.5
      direction: horizontal
    - type: RandomColorJitter
      keys:
      - lq
      brightness: 0.0
      saturation: 0.0
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
    test_mode: false
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  val:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/niguang_train_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/niguang_train_data
    ann_file: adaint/annfiles/Face/niguang_val.txt
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: ResizeToMatch
      keys:
      - lq
      reference_key: gt
      interpolation: area
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
  test:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/niguang_train_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/niguang_train_data
    ann_file: adaint/annfiles/Face/niguang_val.txt
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: ResizeToMatch
      keys:
      - lq
      reference_key: gt
      interpolation: area
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
optimizers:
  type: Adam
  lr: 0.00005
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  paramwise_cfg:
    custom_keys:
      backbone:
        lr_mult: 0.1
      branches:
        lr_mult: 0.2
      local_decoder:
        lr_mult: 0.2
      foreground_roi:
        lr_mult: 1.0
lr_config:
  policy: CosineAnnealing
  min_lr: 1.0e-06
  by_epoch: false
checkpoint_config:
  save_optimizer: true
evaluation:
  save_image: false
log_config:
  hooks:
  - type: LUTEpochTextLoggerHook
visual_config: null
dist_params:
  backend: nccl
log_level: INFO
work_dir: ./work_dirs/face_niguang_roi_lab
load_from: null
resume_from: null
find_unused_parameters: true
log_interval_epochs: 1
dataset: face
semantic_masks:
  foreground_ignore_boxes:
    "82":
    - [0.0, 0.0, 1.0, 0.42]
  region_label: face_hair_neck
  train_foreground_root: /DB/data/yujietang/IQ-LUT/face_dataset/niguang_train_data_masks/masks
  val_foreground_root: /DB/data/yujietang/IQ-LUT/face_dataset/niguang_train_data_masks/masks
  test_foreground_root: /DB/data/yujietang/IQ-LUT/face_dataset/niguang_train_data_masks/masks
  train_face_root: null
  val_face_root: null
  test_face_root: null
  foreground_suffix: _face_mask
  face_suffix: _face_mask
  feather_radius: 1
  perturb_probability: 0.0
  perturb_pixels: 1
best_checkpoint_metric: deltaE_P3_foreground
best_checkpoint_rule: less
dataset_split:
  description: numeric ID order; last ceil(10%) held out, matching existing Face split
    convention
  train_count: 76
  val_count: 9
  val_ratio: 0.1
  test_uses_validation: true

custom_imports:
  imports:
    - adaint
  allow_failed_imports: false

# Keep all shape-affecting parameters and the tone/interval parameterization
# synchronized with the training config used to produce the checkpoint.
model:
  type: AiLUTArchitectureV2
  n_ranks: 4
  n_vertices: 33
  coarse_vertices: 17
  curve_points: 16
  stats_bins: 16
  stats_pool_size: 64
  condition_dim: 256
  head_hidden_dim: 128
  vertex_embedding_dim: 64
  n_spatial_luts: 2
  guide_resolution: 128
  guide_channels: 16
  guide_temperature: 1.0
  signed_weight_scale: 1.0
  expert_init_scale: 0.01
  use_interval_floor: true
  min_interval: 0.001
  use_flexible_tone_endpoints: true
  tone_endpoint_range: 0.05
  use_diagonal_monotonicity: true
  use_spatial_smoothness: true
  spatial_smoothness_factor: 0.001
  en_adaint: true
  en_adaint_share: false
  backbone: tpami
  pretrained: false
  n_colors: 3
  sparse_factor: 0.0
  smooth_factor: 0.0
  monotonicity_factor: 10.0
  recons_loss:
    type: L1Loss
    loss_weight: 1.0

test_cfg:
  metrics: null
  crop_border: 0

data:
  workers_per_gpu: 1
  test_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 1
  test:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    ann_file: adaint/annfiles/Face/test.txt
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
    pipeline:
      - type: LoadImageFromFile
        io_backend: disk
        key: lq
        backend: pillow
        channel_order: rgb
      - type: FlexibleRescaleToZeroOne
        keys: [lq]
        precision: 32
      - type: ImageToTensor
        keys: [lq]
      - type: Collect
        keys: [lq]
        meta_keys: [lq_path]

dist_params:
  backend: nccl
log_level: INFO
work_dir: ./work_dirs/face_test_architecture_v2

custom_imports:
  imports:
    - adaint
  allow_failed_imports: false

# Keep these architecture values in sync with face_indoor_tone.yaml.
model:
  type: AiLUT
  n_ranks: 4
  n_vertices: 33
  coarse_vertices: 17
  use_tone_curve: true
  curve_points: 16
  use_softmax_experts: true
  expert_temperature: 1.0
  en_adaint: true
  en_adaint_share: false
  backbone: res18
  pretrained: false
  n_colors: 3
  sparse_factor: 0.0
  smooth_factor: 0.0
  monotonicity_factor: 10.0
  recons_loss:
    type: L1Loss
    loss_weight: 1.0

test_cfg:
  metrics: null
  crop_border: 0

data:
  workers_per_gpu: 1
  test_dataloader:
    samples_per_gpu: 1
    workers_per_gpu: 1
  test:
    type: Face
    dir_lq: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    dir_gt: /DB/data/yujietang/IQ-LUT/face_dataset/all/3_test_data
    ann_file: adaint/annfiles/Face/test.txt
    test_mode: true
    filetmpl_lq: '{}_input.jpg'
    filetmpl_gt: '{}_gt.jpg'
    pipeline:
      - type: LoadImageFromFile
        io_backend: disk
        key: lq
        backend: pillow
        channel_order: rgb
      - type: FlexibleRescaleToZeroOne
        keys: [lq]
        precision: 32
      - type: ImageToTensor
        keys: [lq]
      - type: Collect
        keys: [lq]
        meta_keys: [lq_path]

dist_params:
  backend: nccl
log_level: INFO
work_dir: ./work_dirs/face_test_tone

dataset: ppr10k
data_root: /remote-home/share/yujietang/dataset/PRR10K
target: a
exp_name: ppr10k_global_affine
custom_imports:
  imports:
  - adaint
  allow_failed_imports: false
gen: 1
train_epochs: 300
adaint_fix_epochs: 5
checkpoint_interval_epochs: 1
evaluation_interval_epochs: 15
log_interval_epochs: 1
infer_after_generation: false
enable_kd: false
kdloss_type: MSELoss
kdloss_weight: 0.1
model:
  type: AiLUT
  n_ranks: 5
  n_vertices: 33
  curve_points: 16
  stats_bins: 16
  stats_pool_size: 64
  condition_dim: 256
  head_hidden_dim: 128
  local_resolution: 128
  local_channels: 16
  context_size: 256
  min_interval: 0.001
  guided_filter_radius: 2
  guided_filter_epsilon: 0.001
  backbone: tpami
  pretrained: false
  smooth_factor: 1.0e-05
  monotonicity_factor: 0.01
  global_magnitude_factor: 1.0e-05
  local_magnitude_factor: 0.001
  local_smoothness_factor: 0.0001
  edge_smoothness_scale: 10.0
  kd_decay_start_ratio: 0.3
  kd_decay_end_ratio: 1.0
  kd_final_weight: 0.0
test_cfg:
  metrics:
  - PSNR
  - deltaE
  - PSNR_hc
  - deltaE_hc
  crop_border: 0
train_pipeline:
- type: LoadImageFromFile
  io_backend: disk
  key: lq
  backend: pillow
  channel_order: rgb
- type: LoadImageFromFile
  io_backend: disk
  key: gt
  backend: pillow
  channel_order: rgb
- type: ResizeToMatch
  keys:
  - lq
  reference_key: gt
  interpolation: area
- type: RandomRatioCrop
  keys:
  - lq
  - gt
  crop_ratio:
  - 0.6
  - 1.0
- type: Resize
  keys:
  - lq
  - gt
  scale:
  - 448
  - 448
  backend: cv2
  interpolation: bilinear
- type: Flip
  keys:
  - lq
  - gt
  flip_ratio: 0.5
  direction: horizontal
- type: FlexibleRescaleToZeroOne
  keys:
  - lq
  - gt
  precision: 32
- type: ImageToTensor
  keys:
  - lq
  - gt
- type: Collect
  keys:
  - lq
  - gt
  meta_keys:
  - lq_path
  - gt_path
paired_test_pipeline:
- type: LoadImageFromFile
  io_backend: disk
  key: lq
  backend: pillow
  channel_order: rgb
- type: LoadImageFromFile
  io_backend: disk
  key: gt
  backend: pillow
  channel_order: rgb
- type: FlexibleRescaleToZeroOne
  keys:
  - lq
  - gt
  precision: 32
- type: ImageToTensor
  keys:
  - lq
  - gt
- type: Collect
  keys:
  - lq
  - gt
  meta_keys:
  - lq_path
  - gt_path
  - mask_path
data:
  workers_per_gpu: 8
  train_dataloader:
    samples_per_gpu: 256
  val_dataloader:
    samples_per_gpu: 64
  test_dataloader:
    samples_per_gpu: 64
    workers_per_gpu: 4
  train:
    type: PPR10KFolder
    dir_lq: /remote-home/share/yujietang/dataset/PRR10K/prr_train/source
    dir_gt: /remote-home/share/yujietang/dataset/PRR10K/prr_train/target_a
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: ResizeToMatch
      keys:
      - lq
      reference_key: gt
      interpolation: area
    - type: RandomRatioCrop
      keys:
      - lq
      - gt
      crop_ratio:
      - 0.6
      - 1.0
    - type: Resize
      keys:
      - lq
      - gt
      scale:
      - 448
      - 448
      backend: cv2
      interpolation: bilinear
    - type: Flip
      keys:
      - lq
      - gt
      flip_ratio: 0.5
      direction: horizontal
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
    test_mode: false
  val:
    type: PPR10KFolder
    dir_lq: /remote-home/share/yujietang/dataset/PRR10K/prr_value/source
    dir_gt: /remote-home/share/yujietang/dataset/PRR10K/prr_value/target_a
    dir_mask: /remote-home/share/yujietang/dataset/PRR10K/masks_360p
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
      - mask_path
    test_mode: true
  test:
    type: PPR10KFolder
    dir_lq: /remote-home/share/yujietang/dataset/PRR10K/prr_value/source
    dir_gt: /remote-home/share/yujietang/dataset/PRR10K/prr_value/target_a
    dir_mask: /remote-home/share/yujietang/dataset/PRR10K/masks_360p
    pipeline:
    - type: LoadImageFromFile
      io_backend: disk
      key: lq
      backend: pillow
      channel_order: rgb
    - type: LoadImageFromFile
      io_backend: disk
      key: gt
      backend: pillow
      channel_order: rgb
    - type: FlexibleRescaleToZeroOne
      keys:
      - lq
      - gt
      precision: 32
    - type: ImageToTensor
      keys:
      - lq
      - gt
    - type: Collect
      keys:
      - lq
      - gt
      meta_keys:
      - lq_path
      - gt_path
      - mask_path
    test_mode: true
optimizers:
  type: Adam
  lr: 0.001
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  paramwise_cfg:
    custom_keys:
      adaint:
        lr_mult: 0.1
lr_config:
  policy: CosineAnnealing
  min_lr: 1.0e-06
checkpoint_config:
  save_optimizer: true
evaluation:
  save_image: false
log_config:
  hooks:
  - type: LUTEpochTextLoggerHook
visual_config: null
dist_params:
  backend: nccl
log_level: INFO
work_dir: ./work_dirs/ppr10k_global_affine
load_from: null
resume_from: null
find_unused_parameters: true
